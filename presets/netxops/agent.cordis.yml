# Netx Ops delta only — NOT a full agent composition.
#
# At Host apply, `ensureAgentPresetInstalled` copies the Harness shipped
# `standard` preset into `$DSH_HOME/.agent-presets/netxops`, then:
#   1. replaces `persona` with presets/netxops/PERSONA.md
#   2. ensures the `netxops-tools` row below is present
#   3. copies presets/netxops/skills/
#
# DSH has no preset inheritance; composing from `standard` at install time is
# how Netx Ops stays aligned with the running Harness without embedding (or
# declaring via `@deepseek-ai/dsh-agent-preset`) a full standard tree.

- id: netxops-tools
  name: dsh-netxops/tools
