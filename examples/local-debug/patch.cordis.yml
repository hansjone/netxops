# Local DeepSeekHarness overlay: discover netxops preset + mount host bridge.
#
# Usage (from DeepSeekHarness root):
#   pnpm dsh web --patch D:/project/chatgpt/netxops/examples/local-debug/patch.cordis.yml
#
# Prefer also: scripts/link-preset.ps1 and scripts/set-netx-token.ps1

- replace:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
        includeShippedRoot: true
        includeUserRoot: true
        roots:
          - path: D:/project/chatgpt/netxops/presets
            trust: user

- insert:
    - id: netxops
      name: D:/project/chatgpt/netxops/src/index.ts
      config:
        apiUrl: http://127.0.0.1:8890
        lang: zh
        pythonCommand: python
        tokenCredentialRef: NETX_API_TOKEN
        toolCallTimeoutMs: 120000
        failOnStartupError: false
